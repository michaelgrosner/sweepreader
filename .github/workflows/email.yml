name: Email Digest

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run (print instead of send)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: email
  cancel-in-progress: false

jobs:
  email:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        # requirements.lock is fully pinned and hash-checked, so a new release
        # upstream can never land in a scheduled run on its own; --no-deps keeps
        # the editable install from resolving anything behind it. Regenerate with
        # the uv command in the lockfile header.
        run: |
          pip install -r requirements.lock
          pip install -e . --no-deps

      - name: Send email digest
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          SMTP_TO: ${{ secrets.SMTP_TO }}
        run: |
          DRY_FLAG=""
          if [ "${{ inputs.dry_run }}" = "true" ]; then DRY_FLAG="--dry-run"; fi
          python -m sweepreader email --config config.yaml $DRY_FLAG

      - name: Commit state
        if: ${{ inputs.dry_run != 'true' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f data/state.json || true
          git diff --cached --quiet || git commit -m "chore: advance email watermark [skip ci]"
          git push || true
