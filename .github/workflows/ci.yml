name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        # requirements.lock is fully pinned and hash-checked, so a new release
        # upstream can never land in a scheduled run on its own; --no-deps keeps
        # the editable install from resolving anything behind it. Regenerate with
        # the uv command in the lockfile header.
        run: |
          pip install -r requirements.lock
          pip install -e . --no-deps

      - name: Lint (ruff)
        run: python -m ruff check

      - name: Type check (mypy)
        run: python -m mypy

      - name: Run tests
        run: python -m pytest -v
