name: Rebuild Page

on:
  schedule:
    - cron: "7 */3 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  rebuild:
    # Pinned for the same reason as requirements.lock: ubuntu-latest moves to a
    # new image on GitHub's schedule (Ubuntu 26, from 2026-10-19), which can drop
    # a prebuilt Python or change system libs under a run no one touched.
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install dependencies
        # requirements.lock is fully pinned and hash-checked, so a new release
        # upstream can never land in a scheduled run on its own; --no-deps keeps
        # the editable install from resolving anything behind it. Regenerate with
        # the uv command in the lockfile header.
        run: |
          pip install --progress-bar off -r requirements.lock
          pip install -e . --no-deps

      - name: Run pipeline
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: python -m sweepreader run --config config.yaml

      - name: Commit data shards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/items/ data/classifications/ data/groups/ || true
          git add -f data/state.json || true
          git diff --cached --quiet || git commit -m "chore: update data shards [skip ci]"
          git push || true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: docs/

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

      - name: Flag failures
        if: always()
        run: |
          python -c "
          import json, sys
          try:
              state = json.load(open('data/state.json'))
              health = state.get('source_health', {})
              errors = sum(1 for src in health.values() if src.get('status') == 'error')
              if errors > 0:
                  print(f'::warning::{errors} source(s) failed with critical errors this run')
              # A refused key (spend cap, no credit) or null responses used to
              # surface only as keyword-fallback cards on the page, for days.
              llm = state.get('llm_last_run') or {}
              if llm.get('halted'):
                  print(f\"::error::LLM classification halted: {llm['halted']}\")
              elif llm.get('fell_back'):
                  print(f\"::warning::{llm['fell_back']} item(s) fell back to keyword classification\")
              if errors > 0 or llm.get('halted'):
                  sys.exit(1)
          except FileNotFoundError:
              pass
          "
