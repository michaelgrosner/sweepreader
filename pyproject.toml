[build-system]
requires = ["setuptools>=72"]
build-backend = "setuptools.build_meta"

[project]
name = "sweepreader"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27.0",
    "feedparser>=6.0.11",
    "PyYAML>=6.0.2",
    "Jinja2>=3.1.4",
    "selectolax>=0.3.21",
    "pypdf>=4.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.3.0", "pytest-asyncio>=0.24.0", "mypy>=1.11", "ruff>=0.6"]

[project.scripts]
sweepreader = "sweepreader.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.mypy]
python_version = "3.12"
files = ["src", "tests"]
ignore_missing_imports = true
check_untyped_defs = true
warn_redundant_casts = true
warn_unused_configs = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
# Reassigning methods and setting ad-hoc attributes on a config object are
# normal monkeypatching idioms in tests, not defects.
module = "tests.*"
disable_error_code = ["method-assign", "attr-defined"]

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I"]
# E501 line-length: the codebase deliberately runs long; 176 hits, all cosmetic.
# E702/E731: semicolons and lambda assignment are used intentionally in tests.
ignore = ["E501", "E702", "E731"]
